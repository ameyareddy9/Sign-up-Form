<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Document</title>
  </head>

  <body>   
    <div id="left">
      <div id="logo-container">
        <img src="odin-lined.png">
        <h1>ODIN</h1>

      </div>
      <div id="credit">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Unsplash</a></div>
    </div>

    <div id="right">
      <div id="intro">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
        <p>You know you want to.</p>
      </div>

      <form>
        <h2>Let's do this!</h2>

        <div>
          <div>
            <label for="first_name">FIRST NAME</label>
            <input type="text" id="first_name" name="first_name" required/>
          </div> 

          <div> 
            <label for="last_name">LAST NAME</label>
            <input type="text" id="last_name" name="last_name"/>
          </div>
        </div>
        

        <div>
          <div>
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email" required/>
          </div>
            
          <div>
            <label for="phone_number">PHONE NUMBER</label>
            <input type="number" id="phone_number" name="phone_number"/>
          </div>
        </div>
        

        <div>
          <div>
            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" required/>
          </div>
            
          <div>
            <label for="confirm_password">CONFIRM PASSWORD</label>
            <input type="password" id="confirm_password" name="confirm_password" required/>
          </div>
        </div>

      </form>

      <div id="actions">
        <button>Create Account</button>
        <p>Already have an account? <a href="">Log in</a></p>
      </div>
    </div>    
  </body>
</html>
